# Application name for logging - identifies the application in logs and monitoring tools
spring.application.name=decoder-api



# HTTP server port - makes REST API accessible at localhost:8080
server.port=8080




# Enable H2 web console - provides web UI to view database at /h2-console
spring.h2.console.enabled=true



# H2 console URL path - sets the URL endpoint for accessing the database viewer
spring.h2.console.path=/h2-console



# Database file location - file-based H2 database persists data between restarts
spring.datasource.url=jdbc:h2:file:./data/decoder-db



# JDBC driver for H2 - tells Spring Boot which database driver to use for connectivity
spring.datasource.driver-class-name=org.h2.Driver



# Database username - H2 default system administrator account (sa)
spring.datasource.username=sa



# Database password (empty) - no password required for local development
spring.datasource.password=



# H2 SQL dialect - tells Hibernate to use H2-specific SQL syntax
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect



# Auto-create/update tables - automatically generates schema from @Entity classes
spring.jpa.hibernate.ddl-auto=create



# Show SQL queries in logs - displays all database queries in console for debugging
spring.jpa.show-sql=true



# Pretty-print SQL - formats SQL queries with indentation for better readability
spring.jpa.properties.hibernate.format_sql=true



# Fixed username for dev - sets admin username for HTTP Basic Authentication
spring.security.user.name=admin



# Fixed password for dev - sets admin password (plaintext for development only)
spring.security.user.password=admin123



# Run data.sql after table creation - ensures test data loads after Hibernate creates schema
spring.jpa.defer-datasource-initialization=true



# Always execute data.sql on startup - even if database already exists
spring.sql.init.mode=always



# Forecast threshold value - alert level for energy-saving mode (ASHRAE 62.1-2016 standard)
forecast.threshold=70.0
